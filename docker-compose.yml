version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sembako_backend_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - DATABASE_DB_HOST=postgres
      - DATABASE_DB_PORT=5432
      - DATABASE_DB_USER=postgres
      - DATABASE_DB_PASSWORD=postgres
      - DATABASE_DB_NAME=sembako_db
      - DATABASE_DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sembako_net

  postgres:
    image: postgres:16-alpine
    container_name: sembako_postgres_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sembako_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sembako_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sembako_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sembako_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sembako.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - sembako_net

networks:
  sembako_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
