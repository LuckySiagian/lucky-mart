user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting Zone (10 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream Services Definition
    upstream backend_api {
        server backend:8080;
    }

    upstream customer_web {
        server customer-web:80;
    }

    upstream admin_dashboard {
        server admin-dashboard:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Backend REST API Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger API Documentation
        location /swagger/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Health Checks
        location /health/ {
            proxy_pass http://backend_api;
        }

        # Admin Dashboard SPA Proxy
        location /admin {
            proxy_pass http://admin_dashboard/;
            proxy_set_header Host $host;
        }

        # Customer Web SPA Proxy (Default)
        location / {
            proxy_pass http://customer_web/;
            proxy_set_header Host $host;
        }
    }
}
