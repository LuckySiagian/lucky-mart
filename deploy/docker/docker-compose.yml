version: '3.8'

services:
  # ----------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sembako-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sembako_usr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-sembako_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sembako_usr} -d ${DB_NAME:-sembako_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Redis Cache & Rate Limiting Service
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sembako-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # Golang Backend API Service
  # ----------------------------------------------------
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: sembako-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sembako_usr}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-sembako_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------
  # Customer Web Frontend (React 19 + Nginx)
  # ----------------------------------------------------
  customer-web:
    build:
      context: "../../customer-web"
      dockerfile: Dockerfile
    container_name: sembako-customer-web
    restart: always
    ports:
      - "3001:80"

  # ----------------------------------------------------
  # Admin Dashboard Frontend (React 19 + Nginx)
  # ----------------------------------------------------
  admin-dashboard:
    build:
      context: "../../admin-dashboard"
      dockerfile: Dockerfile
    container_name: sembako-admin-dashboard
    restart: always
    ports:
      - "3000:80"

  # ----------------------------------------------------
  # Reverse Proxy Gateway (Nginx)
  # ----------------------------------------------------
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: sembako-nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - customer-web
      - admin-dashboard

  # ----------------------------------------------------
  # pgAdmin Database Management GUI
  # ----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: sembako-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sembako.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
    ports:
      - "5050:80"

  # ----------------------------------------------------
  # Prometheus Metrics Collector
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: sembako-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - "../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"

  # ----------------------------------------------------
  # Grafana Monitoring Dashboards
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.3
    container_name: sembako-grafana
    restart: always
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}

volumes:
  postgres_data:
  redis_data:
